version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/aposd2e-zh.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains:
    - kind: node
      version: 22.x
  run_buildscript: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 软件设计的哲学（第二版）
    summary: "《软件设计的哲学，第二版》中文翻译，VuePress 静态文档站，支持简体/英文/繁体。"
