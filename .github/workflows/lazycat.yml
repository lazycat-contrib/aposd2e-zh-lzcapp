name: LazyCat LPK Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LAZYCAT_WORKFLOW_TOOLCHAINS: node
      LAZYCAT_WORKFLOW_NODE_VERSION: 22.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: ca-x/lazycat-github-action@v1
        id: lazycat
        with:
          operation: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload LPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpk-package
          path: dist/aposd2e-zh.lpk
